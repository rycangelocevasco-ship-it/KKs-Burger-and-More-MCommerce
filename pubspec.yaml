
name: kks_burger_and_more
description: "KK's Burger and More - M-Commerce Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Fonts
  google_fonts: ^9.0.0

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_database: ^13.0.1
  firebase_storage: ^14.0.1

  # Images and Utilities
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6
  intl: ^0.20.3
  file_picker: ^13.3.2
  image: ^4.12.0
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
